readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.20",
    "streamlit>=1.31.0",
    "audio-recorder-streamlit>=0.0.8",
    "openai>=1.12.0",
    "elevenlabs>=0.2.27",
    "chromadb>=0.4.22",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]
